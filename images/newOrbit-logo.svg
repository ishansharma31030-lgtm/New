<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#b0d4f1"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </radialGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E3F2FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#90CAF9" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Building icon (scaled to fit 100x100 box, centered at x=50) -->
  <g transform="translate(0, 0) scale(0.5)">
    <g filter="url(#shadow)">
      <polygon points="30,160 70,40 100,100 60,160" fill="url(#leftGrad)" opacity="0.95"/>
      <line x1="30" y1="160" x2="85" y2="70" stroke="#aaccee" stroke-width="1.2" opacity="0.7"/>
      <line x1="40" y1="155" x2="90" y2="60" stroke="#aaccee" stroke-width="1" opacity="0.5"/>
      <line x1="50" y1="150" x2="95" y2="50" stroke="#aaccee" stroke-width="1" opacity="0.5"/>
      <line x1="30" y1="130" x2="80" y2="100" stroke="#aaccee" stroke-width="1" opacity="0.6"/>
      <line x1="35" y1="110" x2="75" y2="70" stroke="#aaccee" stroke-width="1" opacity="0.5"/>
      <line x1="42" y1="90" x2="70" y2="60" stroke="#aaccee" stroke-width="1" opacity="0.4"/>
      <circle cx="60" cy="115" r="3" fill="#ffffff" opacity="0.8"/>
      <line x1="60" y1="105" x2="60" y2="125" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
      <line x1="50" y1="115" x2="70" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
      <line x1="53" y1="108" x2="67" y2="122" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
      <line x1="67" y1="108" x2="53" y2="122" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    </g>
    <g filter="url(#shadow)">
      <polygon points="100,100 140,40 170,160 130,160" fill="url(#rightGrad)" opacity="0.97"/>
      <line x1="100" y1="100" x2="160" y2="130" stroke="#90caf9" stroke-width="1.2" opacity="0.6"/>
      <line x1="110" y1="80" x2="165" y2="140" stroke="#90caf9" stroke-width="1" opacity="0.5"/>
      <line x1="120" y1="60" x2="168" y2="150" stroke="#90caf9" stroke-width="1" opacity="0.5"/>
      <line x1="105" y1="115" x2="150" y2="100" stroke="#90caf9" stroke-width="1" opacity="0.5"/>
      <line x1="115" y1="95" x2="155" y2="75" stroke="#90caf9" stroke-width="1" opacity="0.4"/>
      <circle cx="140" cy="130" r="3" fill="#ffffff" opacity="0.7"/>
      <line x1="140" y1="120" x2="140" y2="140" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
      <line x1="130" y1="130" x2="150" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
      <line x1="133" y1="123" x2="147" y2="137" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
      <line x1="147" y1="123" x2="133" y2="137" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    </g>
    <line x1="70" y1="40" x2="140" y2="40" stroke="url(#leftGrad)" stroke-width="3" opacity="0.5"/>
    <ellipse cx="100" cy="100" rx="88" ry="38" stroke="url(#orbitGrad)" stroke-width="3.5"
             fill="none" transform="rotate(-20 100 100)" opacity="0.92" stroke-linecap="round"/>
    <g>
      <circle cx="0" cy="0" r="11" fill="url(#sphereGrad)" filter="url(#shadow)"/>
      <circle cx="-3" cy="-3" r="3.5" fill="#e3f2fd" opacity="0.6"/>
      <animateMotion dur="5s" repeatCount="indefinite" rotate="0"
        path="M 182.69,69.90 A 88,38,-20,0,1,17.31,130.10 A 88,38,-20,0,1,182.69,69.90"/>
    </g>
  </g>

  <!-- Vertical separator -->
  <line x1="105" y1="14" x2="105" y2="86" stroke="#1E88E5" stroke-width="1" opacity="0.4"/>

  <!-- NEWORBIT wordmark -->
  <text x="116" y="44"
    font-family="Arial Black, Impact, sans-serif"
    font-size="26"
    font-weight="900"
    fill="url(#wordGrad)"
    letter-spacing="2"
    filter="url(#glow)">NEWORBIT</text>

  <!-- BIM SERVICES subtitle -->
  <text x="117" y="62"
    font-family="Arial, sans-serif"
    font-size="12"
    font-weight="700"
    fill="#42A5F5"
    letter-spacing="3">BIM SERVICES</text>

  <!-- Tagline -->
  <text x="117" y="76"
    font-family="Arial, sans-serif"
    font-size="7.5"
    font-weight="400"
    fill="#90CAF9"
    letter-spacing="1.5"
    opacity="0.85">BIM SOLUTION · SCAN TO BIM · AUTOMATION</text>

</svg>
