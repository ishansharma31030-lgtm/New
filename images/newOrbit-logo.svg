<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 100" width="620" height="100">
  <defs>
    <linearGradient id="faceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#29B6F6;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#0277BD;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#E3F2FD;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#90CAF9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29B6F6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="axisGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="digitalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tealglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BIM Coordinate Axes (origin at bottom-left of building) -->
  <!-- X axis -->
  <line x1="14" y1="82" x2="42" y2="82" stroke="#F44336" stroke-width="1.2" opacity="0.7"/>
  <polygon points="42,80 46,82 42,84" fill="#F44336" opacity="0.7"/>
  <text x="44" y="87" font-family="Arial, sans-serif" font-size="6" fill="#F44336" font-weight="700" opacity="0.8">X</text>
  <!-- Y axis (up) -->
  <line x1="14" y1="82" x2="14" y2="58" stroke="#4CAF50" stroke-width="1.2" opacity="0.7"/>
  <polygon points="12,58 14,54 16,58" fill="#4CAF50" opacity="0.7"/>
  <text x="8" y="56" font-family="Arial, sans-serif" font-size="6" fill="#4CAF50" font-weight="700" opacity="0.8">Z</text>
  <!-- Z axis (depth) -->
  <line x1="14" y1="82" x2="28" y2="90" stroke="#2196F3" stroke-width="1.2" opacity="0.7"/>
  <polygon points="27,92 31,91 28,88" fill="#2196F3" opacity="0.7"/>
  <text x="30" y="94" font-family="Arial, sans-serif" font-size="6" fill="#2196F3" font-weight="700" opacity="0.8">Y</text>

  <!-- Ground shadow -->
  <ellipse cx="52" cy="86" rx="36" ry="5" fill="#1E90FF" opacity="0.15"/>

  <!-- Digital mesh base layer (BIM digital twin effect) -->
  <line x1="26" y1="78" x2="20" y2="84" stroke="#00E5FF" stroke-width="0.4" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="50" y1="78" x2="50" y2="88" stroke="#00E5FF" stroke-width="0.4" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="74" y1="66" x2="80" y2="72" stroke="#00E5FF" stroke-width="0.4" opacity="0.3" stroke-dasharray="2,2"/>

  <!-- Top face flat roof surface -->
  <polygon points="50,16 74,28 50,40 26,28" fill="url(#faceTop)" opacity="0.9"/>
  <!-- Left face -->
  <polygon points="26,28 50,40 50,78 26,66" fill="url(#faceLeft)"/>
  <!-- Right face -->
  <polygon points="74,28 50,40 50,78 74,66" fill="url(#faceRight)"/>

  <!-- Floor plate lines left face -->
  <line x1="26" y1="40" x2="50" y2="52" stroke="#90CAF9" stroke-width="0.8" opacity="0.7"/>
  <line x1="26" y1="52" x2="50" y2="64" stroke="#90CAF9" stroke-width="0.8" opacity="0.7"/>
  <!-- Floor plate lines right face -->
  <line x1="74" y1="40" x2="50" y2="52" stroke="#64B5F6" stroke-width="0.8" opacity="0.6"/>
  <line x1="74" y1="52" x2="50" y2="64" stroke="#64B5F6" stroke-width="0.8" opacity="0.6"/>

  <!-- Structural grid verticals left -->
  <line x1="32" y1="30" x2="32" y2="67" stroke="#90CAF9" stroke-width="0.7" opacity="0.55"/>
  <line x1="38" y1="33" x2="38" y2="70" stroke="#90CAF9" stroke-width="0.7" opacity="0.55"/>
  <line x1="44" y1="36" x2="44" y2="73" stroke="#90CAF9" stroke-width="0.7" opacity="0.55"/>
  <!-- Structural grid verticals right -->
  <line x1="68" y1="30" x2="68" y2="67" stroke="#64B5F6" stroke-width="0.7" opacity="0.45"/>
  <line x1="62" y1="33" x2="62" y2="70" stroke="#64B5F6" stroke-width="0.7" opacity="0.45"/>
  <line x1="56" y1="36" x2="56" y2="73" stroke="#64B5F6" stroke-width="0.7" opacity="0.45"/>

  <!-- Roof grid lines -->
  <line x1="38" y1="21" x2="62" y2="33" stroke="#B3E5FC" stroke-width="0.7" opacity="0.6"/>
  <line x1="32" y1="24" x2="56" y2="36" stroke="#B3E5FC" stroke-width="0.7" opacity="0.5"/>

  <!-- BIM Dimension annotation lines -->
  <!-- Horizontal dimension (width) -->
  <line x1="26" y1="72" x2="50" y2="84" stroke="#00E5FF" stroke-width="0.6" opacity="0.5"/>
  <line x1="26" y1="70" x2="26" y2="74" stroke="#00E5FF" stroke-width="0.6" opacity="0.5"/>
  <line x1="50" y1="82" x2="50" y2="86" stroke="#00E5FF" stroke-width="0.6" opacity="0.5"/>
  <text x="34" y="81" font-family="Arial, sans-serif" font-size="5" fill="#00E5FF" opacity="0.6" transform="rotate(26, 34, 81)">24.0m</text>
  <!-- Vertical dimension (height) -->
  <line x1="78" y1="28" x2="78" y2="66" stroke="#00E5FF" stroke-width="0.6" opacity="0.5"/>
  <line x1="76" y1="28" x2="80" y2="28" stroke="#00E5FF" stroke-width="0.6" opacity="0.5"/>
  <line x1="76" y1="66" x2="80" y2="66" stroke="#00E5FF" stroke-width="0.6" opacity="0.5"/>
  <text x="81" y="50" font-family="Arial, sans-serif" font-size="5" fill="#00E5FF" opacity="0.6">38.0m</text>

  <!-- BIM Level markers on left edge -->
  <line x1="22" y1="28" x2="26" y2="28" stroke="#00BCD4" stroke-width="0.7" opacity="0.6"/>
  <text x="12" y="30" font-family="Arial, sans-serif" font-size="4" fill="#00BCD4" opacity="0.55">L3</text>
  <line x1="22" y1="40" x2="26" y2="40" stroke="#00BCD4" stroke-width="0.7" opacity="0.6"/>
  <text x="12" y="42" font-family="Arial, sans-serif" font-size="4" fill="#00BCD4" opacity="0.55">L2</text>
  <line x1="22" y1="53" x2="26" y2="53" stroke="#00BCD4" stroke-width="0.7" opacity="0.6"/>
  <text x="12" y="55" font-family="Arial, sans-serif" font-size="4" fill="#00BCD4" opacity="0.55">L1</text>
  <line x1="22" y1="66" x2="26" y2="66" stroke="#00BCD4" stroke-width="0.7" opacity="0.6"/>
  <text x="12" y="68" font-family="Arial, sans-serif" font-size="4" fill="#00BCD4" opacity="0.55">L0</text>

  <!-- Outer wireframe edges -->
  <line x1="26" y1="28" x2="26" y2="66" stroke="#4FC3F7" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>
  <line x1="74" y1="28" x2="74" y2="66" stroke="#4FC3F7" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>
  <line x1="50" y1="40" x2="50" y2="78" stroke="#29B6F6" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>
  <line x1="26" y1="66" x2="50" y2="78" stroke="#4FC3F7" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>
  <line x1="74" y1="66" x2="50" y2="78" stroke="#4FC3F7" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>
  <line x1="26" y1="28" x2="50" y2="40" stroke="#81D4FA" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>
  <line x1="74" y1="28" x2="50" y2="40" stroke="#81D4FA" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>
  <line x1="26" y1="24" x2="50" y2="12" stroke="#B3E5FC" stroke-width="1.5" filter="url(#glow)" opacity="0.9"/>
  <line x1="74" y1="24" x2="50" y2="12" stroke="#B3E5FC" stroke-width="1.5" filter="url(#glow)" opacity="0.9"/>
  <line x1="26" y1="24" x2="74" y2="24" stroke="#B3E5FC" stroke-width="1.2" opacity="0.7"/>
  <line x1="26" y1="24" x2="26" y2="28" stroke="#81D4FA" stroke-width="1.5" opacity="0.8"/>
  <line x1="74" y1="24" x2="74" y2="28" stroke="#81D4FA" stroke-width="1.5" opacity="0.8"/>

  <!-- BIM Point Cloud / scan dots (Scan-to-BIM effect) -->
  <circle cx="30" cy="35" r="0.8" fill="#00E5FF" opacity="0.5"/>
  <circle cx="34" cy="42" r="0.8" fill="#00E5FF" opacity="0.45"/>
  <circle cx="28" cy="48" r="0.8" fill="#00E5FF" opacity="0.4"/>
  <circle cx="36" cy="55" r="0.8" fill="#00E5FF" opacity="0.5"/>
  <circle cx="42" cy="60" r="0.8" fill="#00E5FF" opacity="0.45"/>
  <circle cx="32" cy="62" r="0.8" fill="#00E5FF" opacity="0.4"/>
  <circle cx="60" cy="38" r="0.8" fill="#00E5FF" opacity="0.4"/>
  <circle cx="66" cy="44" r="0.8" fill="#00E5FF" opacity="0.35"/>
  <circle cx="58" cy="50" r="0.8" fill="#00E5FF" opacity="0.4"/>
  <circle cx="64" cy="56" r="0.8" fill="#00E5FF" opacity="0.35"/>
  <circle cx="70" cy="48" r="0.8" fill="#00E5FF" opacity="0.3"/>
  <circle cx="54" cy="62" r="0.8" fill="#00E5FF" opacity="0.4"/>

  <!-- Corner node dots -->
  <circle cx="26" cy="28" r="2.5" fill="#4FC3F7" filter="url(#glow)" opacity="0.95"/>
  <circle cx="74" cy="28" r="2.5" fill="#4FC3F7" filter="url(#glow)" opacity="0.95"/>
  <circle cx="50" cy="40" r="2.5" fill="#29B6F6" filter="url(#glow)" opacity="0.95"/>
  <circle cx="26" cy="66" r="2.5" fill="#4FC3F7" opacity="0.9"/>
  <circle cx="74" cy="66" r="2.5" fill="#4FC3F7" opacity="0.9"/>
  <circle cx="50" cy="78" r="2.5" fill="#29B6F6" opacity="0.9"/>
  <circle cx="50" cy="12" r="3" fill="#B3E5FC" filter="url(#softglow)" opacity="1"/>
  <circle cx="50" cy="12" r="5" fill="none" stroke="#4FC3F7" stroke-width="1" opacity="0.5"/>
  <circle cx="50" cy="12" r="8" fill="none" stroke="#29B6F6" stroke-width="0.6" opacity="0.3"/>

  <!-- Digital orbit ring (BIM digital twin symbol) -->
  <ellipse cx="50" cy="47" rx="38" ry="10" fill="none" stroke="url(#digitalGrad)" stroke-width="0.7" opacity="0.3" stroke-dasharray="3,3" transform="rotate(-15, 50, 47)"/>
  <circle cx="84" cy="42" r="1.8" fill="#00E5FF" filter="url(#tealglow)" opacity="0.6"/>

  <!-- Vertical separator -->
  <line x1="103" y1="18" x2="103" y2="82" stroke="#1E88E5" stroke-width="1" opacity="0.4"/>

  <!-- NEWORBIT wordmark -->
  <text x="114" y="46"
    font-family="Arial Black, Impact, sans-serif"
    font-size="28"
    font-weight="900"
    fill="url(#wordGrad)"
    letter-spacing="3"
    filter="url(#glow)">NEWORBIT</text>

  <!-- BIM pill badge -->
  <rect x="114" y="52" width="46" height="18" rx="4" ry="4" fill="#1565C0" opacity="0.9"/>
  <rect x="114" y="52" width="46" height="18" rx="4" ry="4" fill="none" stroke="#29B6F6" stroke-width="0.8" opacity="0.8"/>
  <text x="116" y="65"
    font-family="Arial Black, sans-serif"
    font-size="11"
    font-weight="900"
    fill="url(#bimGrad)"
    letter-spacing="2">BIM</text>

  <!-- SERVICES text -->
  <text x="166" y="65"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="700"
    fill="#90CAF9"
    letter-spacing="3">SERVICES</text>

  <!-- Tagline -->
  <text x="115" y="80"
    font-family="Arial, sans-serif"
    font-size="8.5"
    font-weight="400"
    fill="#4FC3F7"
    letter-spacing="2.2"
    opacity="0.85">BIM SOLUTIONS · SCAN-TO-BIM · AUTOMATION</text>

  <!-- Accent rule -->
  <line x1="114" y1="49" x2="610" y2="49" stroke="#1E88E5" stroke-width="0.7" opacity="0.35"/>

</svg>
