<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 90" width="540" height="90" role="img" aria-label="NewOrbit BIM Services logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#071226"/>
      <stop offset="100%" stop-color="#0b2340"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6dc7ff"/>
      <stop offset="100%" stop-color="#1e90ff"/>
    </linearGradient>

    <!-- tiny pattern for windows -->
    <pattern id="win" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0b2340"/>
      <rect class="win-lit" x="1" y="1" width="2.6" height="2.6" fill="#ffd66b"/>
      <rect class="win-lit" x="5" y="1" width="2.6" height="2.6" fill="#ffd66b"/>
      <rect class="win-lit" x="1" y="5" width="2.6" height="2.6" fill="#ffd66b"/>
      <rect class="win-lit" x="5" y="5" width="2.6" height="2.6" fill="#ffd66b"/>
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- background rectangle -->
  <rect width="540" height="90" fill="url(#bgGrad)"/>

  <!-- animated skyline group -->
  <g transform="translate(12,8)" filter="none">
    <!-- building 1 -->
    <rect x="0" y="20" width="48" height="62" rx="2" fill="#102940"/>
    <rect x="6" y="26" width="36" height="50" fill="url(#win)" opacity="0.95">
      <!-- animate windows lighting -->
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- building 2 (taller) -->
    <rect x="62" y="6" width="72" height="76" rx="2" fill="#0e3955"/>
    <rect x="70" y="14" width="56" height="60" fill="url(#win)" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5.5s" repeatCount="indefinite" />
    </rect>

    <!-- building 3 (slender) -->
    <rect x="148" y="28" width="40" height="54" rx="2" fill="#12344d"/>
    <rect x="152" y="32" width="32" height="46" fill="url(#win)" opacity="0.65">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.7s" repeatCount="indefinite" />
    </rect>

    <!-- orbital accent -->
    <path d="M220 54 C260 12, 360 12, 400 54" fill="none" stroke="#63b3ed" stroke-width="2" stroke-linecap="round" opacity="0.65">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- floating node -->
    <circle cx="400" cy="54" r="4" fill="#1E90FF">
      <animate attributeName="cx" values="220;400;220" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Wordmark -->
  <g transform="translate(240,40)">
    <text x="0" y="-2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1.2">NEWORBIT BIM SERVICES</text>
    <text x="0" y="18" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#63B3ED" letter-spacing="1.8">BIM SOLUTIONS · AUTOMATION · SCAN-TO-BIM</text>
  </g>

  <!-- small decorative line -->
  <line x1="240" y1="68" x2="526" y2="68" stroke="#1E90FF" stroke-width="1" opacity="0.35"/>

  <style>
    /* gently reduce SVG size on small screens when used as inline image */
    @media (max-width:420px) {
      svg { width:100%; height:auto; }
    }
  </style>
</svg>
